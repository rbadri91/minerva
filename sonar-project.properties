sonar.projectKey=minerva
sonar.projectName=Minerva Research Assistant
sonar.projectVersion=1.0

sonar.sources=agents,graph,ui
sonar.tests=tests
sonar.language=py
sonar.python.version=3.12

# Coverage
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=ui/app.py,**/__init__.py

# Complexity thresholds (SonarQube defaults: warn at 10, block at 25)
sonar.python.xunit.reportPath=test-results.xml

# Duplication
sonar.cpd.exclusions=tests/**
