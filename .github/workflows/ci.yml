name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Complexity check (radon — all functions must be A or B)
        run: |
          python -m radon cc agents/ graph/ -n C --total-average
          # Exit non-zero if any function is C or worse
          BAD=$(python -m radon cc agents/ graph/ -n C | grep -c "^" || true)
          if [ "$BAD" -gt 0 ]; then
            echo "::error::$BAD function(s) exceed complexity grade B"
            python -m radon cc agents/ graph/ -n C -s
            exit 1
          fi

      - name: Unit & integration tests with coverage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -m pytest \
            tests/test_branch_guard.py \
            tests/test_synthesis.py \
            tests/test_manager_agent.py \
            tests/test_worker_agents.py \
            tests/test_memory_cache.py \
            --cov=agents --cov=graph \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
